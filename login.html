<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
  </head>
  <body>
    <header class="login-header">
      <a class="back-button-container" href="index.html" aria-label="Go back to the home page">
        <img class="back-button-icon" src="images/logistic navs/arrow_back_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg" alt="">
      </a>
    </header>

    <main class="login-main">
      <div class="login-page-container">
        <section class="account-intro-section">
          <div class="account-intro-content">
            <h2 class="account-title">Create Account</h2>
            <p class="account-description">Join Quick Drop and get your favorite items Delivered.</p>
          </div>
        </section>
        <form class="account-form-section" id="account-form">
          <div class="placeholder-container">
            <div class="account-form-fields">
              <div class="form-field full-name-field">
                <div class="input-with-icon">
                  <img class="input-icon" src="images/logistic navs/account_circle_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                  <input class="full-name-input" type="text" placeholder="Full Name" autocomplete="name">
                </div>
              </div>
              <div class="form-field email-field">
                <div class="input-with-icon">
                  <img class="input-icon" src="images/logistic navs/mark_email_unread_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                  <input class="email-input" type="email" placeholder="Email Address" autocomplete="email" required>
                </div>
              </div>
              <div class="form-field phone-field">
                <div class="input-with-icon">
                  <img class="input-icon" src="images/logistic navs/call_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                  <input class="phone-input" type="tel" placeholder="Phone Number" autocomplete="tel">
                </div>
              </div>
              <div class="form-field password-field">
                <div class="input-with-icon">
                  <img class="input-icon" src="images/logistic navs/password_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                  <input class="password-input" type="password" placeholder="Password" autocomplete="new-password" required>
                </div>
              </div>
              <div class="form-field confirm-password-field">
                <div class="input-with-icon">
                  <img class="input-icon" src="images/logistic navs/lock_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                  <input class="confirm-password-input" type="password" placeholder="Confirm Password" autocomplete="new-password">
                </div>
              </div>
            </div>
          </div>
        </form>

        <section class="signup-section">
          <div class="signup-button-container">
            <button class="signup-button" type="submit" form="account-form">Sign Up</button>
          </div>
          <div class="divider-container">
            <hr class="divider-line"> <p class="divider-text">or</p> <hr class="divider-line">
          </div>
        </section>

        <section class="social-signup-section">
          <button class="google-signup-button" type="button">
            <img class="social-icon google-icon" src="images/google-logo-transparent.png" alt="">
            <span>Continue with Google</span>
          </button>
          <button class="apple-signup-button" type="button">
            <img class="social-icon apple-icon" src="images/png-transparent-apple-logo-new-york-city-brand-computer-apple-company-computer-logo.png" alt="">
            <span>Continue with Apple</span>
          </button>
        </section>
        
        <section class="existing-account-section">
          <div class="existing-account-content">
            <p class="existing-account-text">Already have an account?</p>
            <a class="login-link" href="#login">Log In</a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
