<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Quick- Drop
    </title>
    <link rel="stylesheet" href="open-page.css">
  </head>
  <body style="margin: 0;">
    <div class="open-page-container">
      <section class="first-section-open-page">
        <img class="logistic-logo" src="images/f264d269-b7c5-4185-a832-a4b4c445e74c.jpg" alt="Delivery truck logo">
        <h1 class="brand-name">
          Quick <span class="b-n-span">Drop</span>
        </h1>
        <div class="slogan-container">
          <p class="brand-slogan">
            Fast.
          </p>
          <p class="brand-slogan">
            Safe.
          </p>
          <p class="brand-slogan">
            Reliable.
          </p>
        </div>
      </section>
      <section class="third-section-open-page">
        <section class="second-section-open-page">
          <button class="get-started">
            Get Started
          </button>
          <div class="login-container">
            <p class="if-you-have-an-account">
              Already have an account?
            </p>
            <a class="login">Log In</a>
          </div>
        </section>
        <img class="open-page-hero-image" src="images/b937d7ac-d3d4-4a0b-a6aa-92dd03483c29.jpg">
      </section>
    </div>
  </body>
</html>
