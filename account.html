<!DOCTYPE html>

    <title>Account-Page</title>
    <link rel="stylesheet" href="account.css">

    <header class="account-header">

            <a class="account-email" href="mailto:mudymuziks@gmail.com">mudymuziks@gmail.com</a>
          </div>
        </section>
        <section class="account-menu" aria-label="Account options">
          <div class="account-menu-list">
            <a class="account-menu-item" href="#orders">
              <span class="account-menu-icon"><img src="images/logistic navs/orders_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></span>

            </a>
            <a class="account-menu-item" href="#address">

              <span class="account-menu-trailing"><img src="images/logistic navs/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg" alt=""></span>

            <a class="account-menu-item" href="#payment-methods">
              <span class="account-menu-icon"><img src="images/logistic navs/credit_card_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></span>

              <span class="account-menu-trailing"><img src="images/logistic navs/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg" alt=""></span>
            </a>
            <a class="account-menu-item" href="#notifications">
              <span class="account-menu-icon"><img src="images/logistic navs/notifications_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></span>

            <a class="account-menu-item" href="#help">
              <span class="account-menu-icon"><img src="images/logistic navs/help_center_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></span>
              <span class="account-menu-label">Help &amp; support</span>
              <span class="account-menu-trailing"><img src="images/logistic navs/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg" alt=""></span>
            </a>
            <a class="account-menu-item" href="#settings">
              <span class="account-menu-icon"><img src="images/logistic navs/settings_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg" alt=""></span>

              <span class="account-menu-trailing"><img src="images/logistic navs/keyboard_arrow_right_37dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.svg" alt=""></span>
